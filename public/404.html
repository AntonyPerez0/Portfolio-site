  <script>(function () { var m; try { m = localStorage.getItem('mode'); } catch (e) {} if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m; })();</script>
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#fdfdfc, #111110); --bg-2: light-dark(#f9f9f8, #191918); --line: light-dark(#e9e8e6, #2a2a28); --line-2: light-dark(#dad9d6, #3b3a37); --muted: light-dark(#63635e, #b5b3ad); --ink: light-dark(#21201c, #eeeeec); --accent: light-dark(oklch(55% 0.16 48), oklch(80% 0.14 70)); --mono: "Geist Mono", ui-monospace, monospace; }
    [data-mode="light"] { color-scheme: light; }
    [data-mode="dark"] { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--muted); font: 400 1rem/1.65 "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { display: grid; gap: 24px; width: min(100%, 32rem); }
    .label { margin: 0; font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: 1rem; font-weight: 500; }
    pre { margin: 0; padding: 16px 20px; border-radius: 12px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font: 400 0.8125rem/1.7 var(--mono); overflow-x: auto; }
    pre span { color: var(--accent); }
    p { margin: 0; }
    a { color: var(--ink); text-decoration-color: var(--line-2); text-underline-offset: 0.22em; }
    a:hover { text-decoration-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
