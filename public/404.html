<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found, Antony Perez</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --paper: oklch(98.6% 0.005 250); --ink: oklch(21% 0.028 262); --ink-2: oklch(36% 0.022 260); --graphite: oklch(21% 0.024 262); --graphite-ink: oklch(93% 0.010 250); --accent: oklch(52% 0.19 258); --accent-2: oklch(76% 0.13 254); --display: "Familjen Grotesk", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
    html, body { overflow-x: clip; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--paper); color: var(--ink); font: 400 1rem/1.55 var(--body); }
    main { display: grid; gap: 24px; max-width: 36rem; }
    h1 { margin: 0; font: 600 clamp(2.5rem, 6vw, 4rem)/1.02 var(--display); letter-spacing: -0.028em; }
    pre { margin: 0; padding: 24px; border-radius: 16px 4px; background: var(--graphite); color: var(--graphite-ink); font: 400 0.875rem/1.6 var(--mono); overflow-x: auto; }
    pre span { color: var(--accent-2); }
    p { margin: 0; color: var(--ink-2); }
    a { color: var(--ink); text-underline-offset: 0.2em; }
    a:hover { text-decoration-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Nothing compiled here.</h1>
    <pre>$ curl -I https://antonyperez.com<span id="path"></span>
HTTP/2 <span>404</span></pre>
    <p>That page doesn’t exist. <a href="/">Go to the home page</a>.</p>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
